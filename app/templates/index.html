<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V2V — Video Subtitle Translator</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #30363d;
    --text: #c9d1d9; --muted: #8b949e; --accent: #58a6ff;
    --green: #3fb950; --red: #f85149; --orange: #d2991d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
  }
  .container { max-width: 780px; margin: 0 auto; padding: 40px 20px; }
  header { text-align: center; margin-bottom: 32px; }
  header h1 { font-size: 28px; font-weight: 600; margin-bottom: 4px; }
  header p { color: var(--muted); font-size: 14px; }

  .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
  .tabs button {
    flex: 1; padding: 10px 8px; border: none; cursor: pointer;
    font-size: 13px; font-weight: 500; color: var(--muted);
    background: transparent; border-bottom: 2px solid transparent; transition: all .2s;
  }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs button:hover { color: var(--text); }

  .panel { display: none; }
  .panel.active { display: block; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 24px;
  }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
  .form-group input, .form-group select {
    width: 100%; padding: 10px 12px; font-size: 14px;
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; outline: none; transition: border-color .2s;
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
  .form-group input::placeholder { color: #484f58; }

  .file-drop {
    border: 2px dashed var(--border); border-radius: 8px;
    padding: 32px; text-align: center; cursor: pointer; transition: border-color .2s, background .2s;
  }
  .file-drop:hover, .file-drop.dragover { border-color: var(--accent); background: rgba(88,166,255,.05); }
  .file-drop .icon { font-size: 32px; margin-bottom: 8px; color: var(--muted); }
  .file-drop p { color: var(--muted); font-size: 14px; }
  .file-drop .file-name { color: var(--accent); font-size: 13px; margin-top: 8px; display: none; }
  .file-drop .file-name.show { display: block; }

  .btn {
    width: 100%; padding: 12px 20px; font-size: 15px; font-weight: 500;
    border: none; border-radius: 6px; cursor: pointer; transition: all .2s;
    background: var(--accent); color: #fff;
  }
  .btn:hover { opacity: .9; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-sm { width: auto; padding: 6px 14px; font-size: 12px; }

  .result { margin-top: 20px; display: none; }
  .result.show { display: block; }

  .status-bar {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px 20px;
  }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: var(--border); }
  .status-dot.active { background: var(--accent); animation: pulse 1.2s infinite; }
  .status-dot.done { background: var(--green); }
  .status-dot.error { background: var(--red); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

  .progress-track { height: 4px; background: var(--border); border-radius: 2px; margin: 12px 0; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; transition: width .3s ease; }
  .progress-text { font-size: 12px; color: var(--muted); }

  .error-msg {
    background: rgba(248,81,73,.1); border: 1px solid var(--red);
    border-radius: 6px; padding: 12px 16px; margin-top: 12px;
    color: var(--red); font-size: 13px;
  }
  .download-link {
    display: block; text-align: center; margin-top: 12px;
    padding: 12px; background: rgba(63,185,80,.1); border: 1px solid var(--green);
    border-radius: 6px; color: var(--green); text-decoration: none;
    font-weight: 500; font-size: 14px; transition: background .2s;
  }
  .download-link:hover { background: rgba(63,185,80,.2); }

  .platform-hints { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .platform-hints span {
    font-size: 11px; color: var(--muted); background: var(--bg);
    border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px;
  }

  /* table */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; }
  td { color: var(--text); }
  tr:hover td { background: rgba(88,166,255,.03); }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500;
  }
  .badge-ok { background: rgba(63,185,80,.15); color: var(--green); }
  .badge-fail { background: rgba(248,81,73,.15); color: var(--red); }
  .badge-proc { background: rgba(88,166,255,.15); color: var(--accent); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>V2V</h1>
    <p>自动视频字幕翻译 — 下载 → 识别 → 翻译 → 烧录</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-panel="panel-upload">上传视频</button>
    <button class="tab" data-panel="panel-url">视频链接</button>
    <button class="tab" data-panel="panel-history">历史记录</button>
    <button class="tab" data-panel="panel-subs">订阅管理</button>
  </div>

  <!-- Upload File Panel -->
  <div class="panel active" id="panel-upload">
    <div class="card">
      <div class="file-drop" id="fileDrop">
        <div class="icon">&#x1F4C2;</div>
        <p>点击选择视频文件 或将文件拖放到这里</p>
        <p style="font-size:12px;margin-top:4px">支持 mp4 / mov / mkv / avi / webm</p>
        <div class="file-name" id="fileName"></div>
      </div>
      <input type="file" id="fileInput" accept=".mp4,.mov,.mkv,.avi,.webm,.flv,.wmv" style="display:none">

      <div class="form-group" style="margin-top:16px">
        <label>目标语言</label>
        <select id="langUpload">
          <option value="zh">中文 (zh)</option>
          <option value="en">English (en)</option>
          <option value="ja">日本語 (ja)</option>
          <option value="ko">한국어 (ko)</option>
          <option value="vi">Tiếng Việt (vi)</option>
          <option value="th">ไทย (th)</option>
          <option value="es">Español (es)</option>
          <option value="fr">Français (fr)</option>
          <option value="de">Deutsch (de)</option>
          <option value="ru">Русский (ru)</option>
          <option value="pt">Português (pt)</option>
          <option value="ar">العربية (ar)</option>
        </select>
      </div>
      <button class="btn" id="btnUpload" disabled>上传并处理</button>
    </div>
  </div>

  <!-- URL Input Panel -->
  <div class="panel" id="panel-url">
    <div class="card">
      <div class="form-group">
        <label>视频链接</label>
        <input type="url" id="urlInput" placeholder="https://www.youtube.com/watch?v=...">
        <div class="platform-hints">
          <span>YouTube</span><span>TikTok</span><span>Facebook</span>
          <span>X.com</span><span>Instagram</span><span>Bilibili</span><span>Vimeo</span>
        </div>
      </div>
      <div class="form-group">
        <label>目标语言</label>
        <select id="langUrl">
          <option value="zh">中文 (zh)</option>
          <option value="en">English (en)</option>
          <option value="ja">日本語 (ja)</option>
          <option value="ko">한국어 (ko)</option>
          <option value="vi">Tiếng Việt (vi)</option>
          <option value="th">ไทย (th)</option>
          <option value="es">Español (es)</option>
          <option value="fr">Français (fr)</option>
          <option value="de">Deutsch (de)</option>
          <option value="ru">Русский (ru)</option>
          <option value="pt">Português (pt)</option>
          <option value="ar">العربية (ar)</option>
        </select>
      </div>
      <button class="btn" id="btnUrl">提交链接</button>
    </div>
  </div>

  <!-- History Panel -->
  <div class="panel" id="panel-history">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <span style="font-weight:600">转换历史</span>
        <button class="btn btn-sm" onclick="loadHistory()">刷新</button>
      </div>
      <div id="historyTable"></div>
    </div>
  </div>

  <!-- Subscriptions Panel -->
  <div class="panel" id="panel-subs">
    <div class="card" style="margin-bottom:16px">
      <h3 style="font-size:14px;margin-bottom:12px">添加订阅</h3>
      <div class="form-group">
        <label>频道/主页 URL</label>
        <input type="url" id="subUrl" placeholder="https://www.youtube.com/@channelname">
      </div>
      <div class="form-group">
        <label>平台</label>
        <select id="subPlatform">
          <option value="youtube">YouTube</option>
          <option value="facebook">Facebook</option>
        </select>
      </div>
      <div class="form-group">
        <label>目标语言</label>
        <select id="subLang">
          <option value="zh">中文</option>
          <option value="en">English</option>
          <option value="vi">Tiếng Việt</option>
          <option value="th">ไทย</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
        </select>
      </div>
      <button class="btn" onclick="addSubscription()">添加订阅</button>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <span style="font-weight:600">我的订阅</span>
        <button class="btn btn-sm" onclick="loadSubscriptions()">刷新</button>
      </div>
      <div id="subsList"></div>
    </div>
  </div>

  <!-- Result Panel -->
  <div class="result" id="result">
    <div class="status-bar">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-weight:600;font-size:14px" id="taskLabel">任务状态</span>
        <span style="font-size:11px;color:var(--muted)" id="taskId"></span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">等待中...</div>
    </div>
    <div class="error-msg" id="errorMsg" style="display:none"></div>
    <a class="download-link" id="downloadLink" style="display:none" href="#" download>下载处理后的视频</a>
  </div>
</div>

<script>
const API = '';

// ── Tab switching ──
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.panel).classList.add('active');
    if (btn.dataset.panel === 'panel-history') loadHistory();
    if (btn.dataset.panel === 'panel-subs') loadSubscriptions();
  });
});

// ── File upload ──
const fileDrop = document.getElementById('fileDrop');
const fileInput = document.getElementById('fileInput');
const fileName = document.getElementById('fileName');
const btnUpload = document.getElementById('btnUpload');
let selectedFile = null;

fileDrop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  if (fileInput.files.length > 0) {
    selectedFile = fileInput.files[0];
    fileName.textContent = selectedFile.name;
    fileName.classList.add('show');
    btnUpload.disabled = false;
  }
});
fileDrop.addEventListener('dragover', e => { e.preventDefault(); fileDrop.classList.add('dragover'); });
fileDrop.addEventListener('dragleave', () => fileDrop.classList.remove('dragover'));
fileDrop.addEventListener('drop', e => {
  e.preventDefault(); fileDrop.classList.remove('dragover');
  if (e.dataTransfer.files.length > 0) {
    selectedFile = e.dataTransfer.files[0];
    fileName.textContent = selectedFile.name;
    fileName.classList.add('show');
    btnUpload.disabled = false;
  }
});
btnUpload.addEventListener('click', async () => {
  if (!selectedFile) return;
  const form = new FormData();
  form.append('video', selectedFile);
  form.append('target_language', document.getElementById('langUpload').value);
  await submit(form, 'upload');
});

// ── URL submission ──
document.getElementById('btnUrl').addEventListener('click', async () => {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) return alert('请输入视频链接');
  if (!url.startsWith('http://') && !url.startsWith('https://')) return alert('链接必须以 http:// 或 https:// 开头');
  const form = new FormData();
  form.append('url', url);
  form.append('target_language', document.getElementById('langUrl').value);
  await submit(form, 'download-url');
});

// ── Submit + Poll ──
async function submit(form, endpoint) {
  const btn = endpoint === 'upload' ? btnUpload : document.getElementById('btnUrl');
  btn.disabled = true; btn.textContent = '提交中...';
  clearResult();
  try {
    const res = await fetch(API + '/' + endpoint, { method: 'POST', body: form });
    if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'HTTP ' + res.status); }
    const data = await res.json();
    showResult(data.task_id);
  } catch (e) { showError(e.message); btn.disabled = false; btn.textContent = endpoint === 'upload' ? '上传并处理' : '提交链接'; }
}
function clearResult() {
  document.getElementById('result').classList.remove('show');
  document.getElementById('errorMsg').style.display = 'none';
  document.getElementById('downloadLink').style.display = 'none';
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('progressText').textContent = '等待中...';
}
function showResult(taskId) {
  document.getElementById('result').classList.add('show');
  document.getElementById('taskId').textContent = '#' + taskId;
  pollStatus(taskId);
}
function showError(msg) {
  document.getElementById('result').classList.add('show');
  document.getElementById('errorMsg').textContent = msg;
  document.getElementById('errorMsg').style.display = 'block';
}
async function pollStatus(taskId) {
  try {
    const res = await fetch(API + '/status/' + taskId);
    if (!res.ok) throw new Error('Task not found');
    const data = await res.json();
    updateStatus(data);
    if (data.status === 'completed') {
      document.getElementById('downloadLink').href = API + '/download/' + taskId;
      document.getElementById('downloadLink').style.display = 'block';
      document.getElementById('btnUpload').disabled = false;
      document.getElementById('btnUpload').textContent = '上传并处理';
      document.getElementById('btnUrl').disabled = false;
      document.getElementById('btnUrl').textContent = '提交链接';
      return;
    }
    if (data.status === 'failed') {
      showError(data.error || '处理失败');
      document.getElementById('btnUpload').disabled = false; document.getElementById('btnUpload').textContent = '上传并处理';
      document.getElementById('btnUrl').disabled = false; document.getElementById('btnUrl').textContent = '提交链接';
      return;
    }
    setTimeout(() => pollStatus(taskId), 2000);
  } catch (e) { showError(e.message); }
}
function updateStatus(data) {
  const labels = {
    'waiting':'等待中','extracting_audio':'提取音频中','transcribing':'语音识别中',
    'translating':'翻译字幕中','burning_subtitles':'烧录字幕中','completed':'完成','failed':'失败'
  };
  document.getElementById('taskLabel').textContent = labels[data.status] || data.status;
  document.getElementById('progressFill').style.width = (data.progress || 0) + '%';
  document.getElementById('progressText').textContent =
    data.status === 'completed' ? '处理完成' : (data.progress || 0) + '% — ' + (labels[data.status] || data.status);
}

// ── History ──
async function loadHistory() {
  try {
    const res = await fetch(API + '/history?limit=100');
    const data = await res.json();
    const tasks = data.tasks || [];
    if (!tasks.length) {
      document.getElementById('historyTable').innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px">暂无记录</p>';
      return;
    }
    let html = '<table><thead><tr><th>来源</th><th>语言</th><th>状态</th><th>时间</th><th></th></tr></thead><tbody>';
    for (const t of tasks) {
      const title = (t.source_title || t.task_id || '').substring(0, 40);
      const st = t.status;
      let badge = 'badge-proc';
      if (st === 'completed') badge = 'badge-ok';
      if (st === 'failed') badge = 'badge-fail';
      const stLabel = {waiting:'等待',extracting_audio:'提取音频',transcribing:'识别',translating:'翻译',burning_subtitles:'烧录',completed:'完成',failed:'失败'}[st] || st;
      html += '<tr>';
      html += '<td title="' + (t.source_url||'') + '">' + title + '</td>';
      html += '<td>' + (t.source_lang||'?') + ' → ' + (t.target_lang||'?') + '</td>';
      html += '<td><span class="badge ' + badge + '">' + stLabel + '</span></td>';
      html += '<td>' + (t.created_at||'').substring(0,16) + '</td>';
      html += '<td>' + (st === 'completed' ? '<a href="' + API + '/download/' + t.task_id + '" style="color:var(--accent);font-size:12px">下载</a>' : '') + '</td>';
      html += '</tr>';
    }
    html += '</tbody></table>';
    document.getElementById('historyTable').innerHTML = html;
  } catch (e) { document.getElementById('historyTable').innerHTML = '<p style="color:var(--red)">加载失败: ' + e.message + '</p>'; }
}

// ── Subscriptions ──
async function addSubscription() {
  const url = document.getElementById('subUrl').value.trim();
  const platform = document.getElementById('subPlatform').value;
  const lang = document.getElementById('subLang').value;
  if (!url) return alert('请输入频道URL');
  const form = new FormData();
  form.append('channel_url', url);
  form.append('platform', platform);
  form.append('target_language', lang);
  try {
    const res = await fetch(API + '/subscriptions', { method: 'POST', body: form });
    if (!res.ok) { const err = await res.json(); throw new Error(err.detail); }
    document.getElementById('subUrl').value = '';
    loadSubscriptions();
  } catch (e) { alert('添加失败: ' + e.message); }
}

async function loadSubscriptions() {
  try {
    const res = await fetch(API + '/subscriptions');
    const data = await res.json();
    const subs = data.subscriptions || [];
    if (!subs.length) {
      document.getElementById('subsList').innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px">暂无订阅</p>';
      return;
    }
    let html = '<table><thead><tr><th>频道</th><th>平台</th><th>目标语言</th><th>最近检查</th><th></th></tr></thead><tbody>';
    for (const s of subs) {
      html += '<tr>';
      html += '<td>' + (s.channel_name || s.channel_url).substring(0, 30) + '</td>';
      html += '<td>' + s.platform + '</td>';
      html += '<td>' + s.target_lang + '</td>';
      html += '<td>' + (s.last_checked||'').substring(0,16) + '</td>';
      html += '<td><button class="btn btn-sm" onclick="checkSub(' + s.id + ')">检查</button> <button class="btn btn-sm" style="background:var(--red)" onclick="delSub(' + s.id + ')">删除</button></td>';
      html += '</tr>';
    }
    html += '</tbody></table>';
    document.getElementById('subsList').innerHTML = html;
  } catch (e) { document.getElementById('subsList').innerHTML = '<p style="color:var(--red)">加载失败</p>'; }
}

async function checkSub(id) {
  try {
    const res = await fetch(API + '/subscriptions/' + id + '/check', { method: 'POST' });
    const data = await res.json();
    alert('发现 ' + data.new_tasks + ' 个新视频，已加入处理队列');
    loadSubscriptions();
    setTimeout(loadHistory, 2000);
  } catch (e) { alert('检查失败: ' + e.message); }
}

async function delSub(id) {
  if (!confirm('确定要删除这个订阅吗？')) return;
  try {
    await fetch(API + '/subscriptions/' + id, { method: 'DELETE' });
    loadSubscriptions();
  } catch (e) { alert('删除失败: ' + e.message); }
}
</script>
</body>
</html>
